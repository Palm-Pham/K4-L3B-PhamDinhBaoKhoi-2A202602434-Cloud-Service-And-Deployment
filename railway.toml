# CP5 — Cấu hình deploy Railway (dùng nếu bạn chọn Railway).
#
# Đặt biến môi trường trong Variables của service agent trên Railway.
# REDIS_URL phải tham chiếu biến của service Redis; giữ API key ngoài repo.
#
# Railway tự gán biến PORT — app phải đọc $PORT, đừng cố định 8000.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
